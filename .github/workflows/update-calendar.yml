name: Update Contribution Calendar

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and render dark calendar SVG
        run: python3 .github/scripts/update_calendar.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/calendar.svg
          if git diff --staged --quiet; then
            echo "No changes in calendar SVG."
          else
            git commit -m "Auto-update contribution calendar [skip ci]"
            git push
          fi
